<script>
  let categories = ['Semua'];
  let allCreatives = [];
  let currentFilter = 'Semua';

  const categoryColors = {
    'Photographer': 'bg-teal-50/80 text-teal-700 dark:bg-teal-500/20 dark:text-teal-300 border border-teal-200 dark:border-teal-500/30',
    'Mural Art': 'bg-emerald-50/80 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-500/30',
    'Sound Engineer': 'bg-cyan-50/80 text-cyan-700 dark:bg-cyan-500/20 dark:text-cyan-300 border border-cyan-200 dark:border-cyan-500/30',
    'Video Director': 'bg-sky-50/80 text-sky-700 dark:bg-sky-500/20 dark:text-sky-300 border border-sky-200 dark:border-sky-500/30',
    'Graphic Designer': 'bg-indigo-50/80 text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-500/30',
    'Animator': 'bg-blue-50/80 text-blue-700 dark:bg-blue-500/20 dark:text-blue-300 border border-blue-200 dark:border-blue-500/30',
  };

  function getColorClass(cat) {
    if (categoryColors[cat]) return categoryColors[cat];
    const colors = [
      'bg-teal-50/80 text-teal-700 dark:bg-teal-500/20 dark:text-teal-300 border border-teal-200 dark:border-teal-500/30',
      'bg-emerald-50/80 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-500/30',
      'bg-cyan-50/80 text-cyan-700 dark:bg-cyan-500/20 dark:text-cyan-300 border border-cyan-200 dark:border-cyan-500/30',
      'bg-sky-50/80 text-sky-700 dark:bg-sky-500/20 dark:text-sky-300 border border-sky-200 dark:border-sky-500/30',
    ];
    let hash = 0;
    for (let i = 0; i < cat.length; i++) { hash += cat.charCodeAt(i); }
    return colors[hash % colors.length];
  }

  // Dark Mode Logic
  function toggleDarkMode() {
    const isDark = document.documentElement.classList.toggle('dark');
    document.getElementById('moonIcon').classList.toggle('hidden', !!isDark);
    document.getElementById('sunIcon').classList.toggle('hidden', !isDark);
    // document.getElementById('sunIcon').classList.toggle('block', !!isDark);
  }

  document.addEventListener('DOMContentLoaded', () => {
    // Check initial dark mode via system pref
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
       document.documentElement.classList.add('dark');
       document.getElementById('moonIcon').classList.add('hidden');
       document.getElementById('sunIcon').classList.remove('hidden');
       document.getElementById('sunIcon').classList.add('block');
    }
    renderFilters();
    fetchData();
  });

  function toggleModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal.classList.contains('hidden')) {
      modal.classList.remove('hidden');
      setTimeout(() => modal.classList.remove('opacity-0'), 10);
    } else {
      modal.classList.add('opacity-0');
      setTimeout(() => modal.classList.add('hidden'), 200);
    }
  }

  function renderFilters() {
    const container = document.getElementById('categoryFilters');
    container.innerHTML = categories.map(cat => `
      <button 
        onclick="setFilter('${cat}')" 
        class="whitespace-nowrap px-4 py-2 flex-shrink-0 snap-center rounded-full text-xs sm:text-sm font-medium transition-all ${
          currentFilter === cat 
            ? 'bg-teal-600 dark:bg-teal-500 text-white shadow-md shadow-teal-600/20 scale-105' 
            : 'bg-white/80 dark:bg-slate-800/80 backdrop-blur-md text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 hover:text-slate-900 dark:hover:text-white shadow-sm'
        }"
        >
        ${cat}
      </button>
    `).join('');
  }

  function setFilter(category) {
    currentFilter = category;
    renderFilters();
    renderGrid();
  }

  function fetchData() {
    // Handling local dev if google script API doesn't exist
    if (typeof google === 'undefined') {
      console.warn("GAS Environment not detected. Waiting...");
      return;
    }
    
    google.script.run
      .withSuccessHandler((response) => {
        if(response.error) {
          document.getElementById('creativeGrid').innerHTML = '<div class="col-span-full py-10 text-center text-red-500 font-inter">Failed to load data.</div>';
          return;
        }
        allCreatives = response;
        
        // Update dynamic categories
        const uniqueCategories = [...new Set(allCreatives.map(c => c.category))];
        categories = ['Semua', ...uniqueCategories];
        renderFilters();
        
        // Populate datalist
        const datalist = document.getElementById('category-suggestions');
        if (datalist) {
          datalist.innerHTML = uniqueCategories.map(cat => `<option value="${cat}">`).join('');
        }
        
        renderGrid();
      })
      .withFailureHandler(() => {
        document.getElementById('creativeGrid').innerHTML = '<div class="col-span-full py-10 text-center text-red-500 font-inter">Network error.</div>';
      })
      .ambilData();
  }

  function generateInitialsAvatar(name) {
    const initials = name.split(' ').map(n => n.charAt(0)).filter(Boolean).join('').substring(0, 3).toUpperCase();
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#0D8B93"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="200" font-weight="bold">${initials}</text></svg>`;
    return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
  }

  function getDisplayImage(person) {
    if (person.photo && person.photo.trim() !== '') return person.photo;
    if (person.ig && person.ig.trim() !== '') {
      var match = person.ig.match(/(?:instagram\.com|ig\.me)\/([^/?]+)/i);
      if (match && match[1]) {
        return 'https://unavatar.io/instagram/' + match[1] + '?fallback=' + encodeURIComponent(generateInitialsAvatar(person.name));
      }
    }
    if (person.web && person.web.trim() !== '') {
      return 'https://image.thum.io/get/width/600/crop/800/' + person.web;
    }
    return generateInitialsAvatar(person.name);
  }

  function getSVGIcon(type) {
    if(type === 'ig') return `<svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>`;
    if(type === 'customLink') return `<svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path></svg>`;
    if(type === 'web') return `<svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>`;
    if(type === 'mapPin') return `<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>`;
    return '';
  }

  function renderGrid() {
    const grid = document.getElementById('creativeGrid');
    const data = currentFilter === 'Semua' ? allCreatives : allCreatives.filter(c => c.category === currentFilter);

    if (data.length === 0) {
      grid.innerHTML = `
        <div class="col-span-full py-16 px-4 bg-white/50 dark:bg-slate-800/30 backdrop-blur-md rounded-3xl border border-slate-200 dark:border-slate-700/50 text-center mx-4 sm:mx-0">
          <div class="text-5xl mb-4 text-slate-300 dark:text-slate-600">📭</div>
          <h3 class="text-xl font-bold text-slate-800 dark:text-slate-200">Tidak Ada Data</h3>
          <p class="text-slate-500 dark:text-slate-400 font-inter text-sm mt-2">Belum ada pekerja kreatif yang terdaftar di kategori ini.</p>
        </div>
      `;
      return;
    }

    grid.innerHTML = data.map(person => {
      const catClass = getColorClass(person.category);
      const displayImage = getDisplayImage(person);
      return `
        <div class="group relative p-4 sm:p-5 lg:p-6 rounded-2xl sm:rounded-[32px] overflow-hidden bg-white dark:bg-slate-900 border border-slate-200/50 dark:border-slate-800 shadow-sm hover:shadow-xl dark:shadow-none hover:shadow-teal-500/10 transition-all duration-500 transform hover:-translate-y-1 flex flex-col h-full min-h-[200px] sm:min-h-[220px]">
          <div class="flex flex-col sm:flex-row items-start gap-3 sm:gap-4 mb-3 sm:mb-4">
            <img src="${displayImage}" alt="${person.name}" class="w-12 h-12 sm:w-16 sm:h-16 lg:w-20 lg:h-20 rounded-full object-cover border-2 border-slate-100 dark:border-slate-800 shadow-sm shrink-0" loading="lazy" onerror="if(!this.src.startsWith('data:image/svg+xml')){this.src=generateInitialsAvatar('${person.name}');}">
            <div class="flex flex-col pt-0 sm:pt-1">
              <h3 class="text-base sm:text-lg lg:text-xl font-bold text-slate-900 dark:text-white leading-tight break-words line-clamp-2">${person.name}</h3>
              <div class="mt-1.5 sm:mt-2 text-left flex flex-col items-start gap-1">
                <span class="inline-block px-2 py-0.5 sm:py-1 rounded text-[9px] sm:text-[10px] lg:text-xs font-semibold border ${catClass}">${person.category}</span>
                ${person.location ? `<span class="flex items-center gap-1 text-[9px] sm:text-[10px] text-slate-500 dark:text-slate-400">${getSVGIcon('mapPin')} ${person.location}</span>` : ''}
              </div>
            </div>
          </div>
          <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-400 font-inter line-clamp-3 lg:line-clamp-4 leading-relaxed flex-1 pt-2 border-t border-slate-100 dark:border-slate-800/50">
            ${person.bio}
          </p>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function submitForm(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    
    const formData = {
      name: document.getElementById('name').value,
      category: document.getElementById('category').value,
      bio: document.getElementById('bio').value,
      photo: document.getElementById('photo').value,
      ig: document.getElementById('ig').value,
      customLink: document.getElementById('customLink').value,
      web: document.getElementById('web').value,
      phone: document.getElementById('phone').value,
      email: document.getElementById('email').value,
      location: document.getElementById('location').value,
    };
    
    const origText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = 'Menyimpan...';

    if (typeof google === 'undefined') {
      alert("Local test block: Formulir mensimulasikan penyimpanan sukses. Ini hanya preview workspace.");
       btn.disabled = false;
       btn.innerHTML = origText;
       document.getElementById('registerForm').reset();
       toggleModal('registerModal');
       return;
    }

    google.script.run
      .withSuccessHandler((response) => {
        btn.disabled = false;
        btn.innerHTML = origText;
        
        if(response.success) {
          document.getElementById('registerForm').reset();
          toggleModal('registerModal');
          fetchData(); // reload
        } else {
          alert('Gagal: ' + response.error);
        }
      })
      .withFailureHandler(() => {
        btn.disabled = false;
        btn.innerHTML = origText;
        alert('Cek koneksi internetmu.');
      })
      .simpanData(formData);
  }
</script>
