<script>
  const categories = ['Semua', 'Photographer', 'Mural Art', 'Sound Engineer', 'Video Director', 'Graphic Designer', 'Animator'];
  let allCreatives = [];
  let currentFilter = 'Semua';

  const categoryColors = {
    'Photographer': 'bg-blue-50 text-blue-700 border-blue-200',
    'Mural Art': 'bg-pink-50 text-pink-700 border-pink-200',
    'Sound Engineer': 'bg-violet-50 text-violet-700 border-violet-200',
    'Video Director': 'bg-red-50 text-red-700 border-red-200',
    'Graphic Designer': 'bg-amber-50 text-amber-700 border-amber-200',
    'Animator': 'bg-emerald-50 text-emerald-700 border-emerald-200',
  };

  document.addEventListener('DOMContentLoaded', () => {
    renderFilters();
    fetchData();
  });

  function toggleModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal.classList.contains('hidden')) {
      modal.classList.remove('hidden');
      setTimeout(() => modal.classList.remove('opacity-0'), 10);
    } else {
      modal.classList.add('opacity-0');
      setTimeout(() => modal.classList.add('hidden'), 200);
    }
  }

  function renderFilters() {
    const container = document.getElementById('categoryFilters');
    container.innerHTML = categories.map(cat => `
      <button 
        onclick="setFilter('${cat}')" 
        class="whitespace-nowrap flex-shrink-0 snap-center px-4 py-1.5 sm:px-5 sm:py-2 rounded-full text-xs sm:text-sm font-medium transition-all ${
          currentFilter === cat 
            ? 'bg-slate-900 text-white shadow-md sm:scale-105' 
            : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 hover:text-slate-900'
        }"
        >
        ${cat}
      </button>
    `).join('');
  }

  function setFilter(category) {
    currentFilter = category;
    renderFilters();
    renderGrid();
  }

  function fetchData() {
    // Handling local dev if google script API doesn't exist
    if (typeof google === 'undefined') {
      console.warn("GAS Environment not detected. Waiting...");
      return;
    }
    
    google.script.run
      .withSuccessHandler((response) => {
        if(response.error) {
          document.getElementById('creativeGrid').innerHTML = '<div class="col-span-full py-10 text-center text-red-500 font-inter">Failed to load data.</div>';
          return;
        }
        allCreatives = response;
        renderGrid();
      })
      .withFailureHandler(() => {
        document.getElementById('creativeGrid').innerHTML = '<div class="col-span-full py-10 text-center text-red-500 font-inter">Network error.</div>';
      })
      .ambilData();
  }

  function getSVGIcon(type) {
    if(type === 'ig') return `<svg class="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>`;
    if(type === 'threads') return `<svg class="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path></svg>`;
    if(type === 'web') return `<svg class="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>`;
    return '';
  }

  function renderGrid() {
    const grid = document.getElementById('creativeGrid');
    const data = currentFilter === 'Semua' ? allCreatives : allCreatives.filter(c => c.category === currentFilter);

    if (data.length === 0) {
      grid.innerHTML = `
        <div class="col-span-full py-16 px-4 bg-white rounded-2xl border border-slate-200 text-center">
          <div class="text-4xl mb-3">📭</div>
          <h3 class="text-lg font-bold text-slate-800">Tidak Ada Data</h3>
          <p class="text-slate-500 font-inter text-sm mt-1">Belum ada pekerja kreatif yang terdaftar di kategori ini.</p>
        </div>
      `;
      return;
    }

    grid.innerHTML = data.map(person => {
      return `
        <div class="group relative aspect-square sm:aspect-[3/4] lg:aspect-[4/5] rounded-xl sm:rounded-[32px] overflow-hidden shadow-sm hover:shadow-xl transition-all duration-500 border border-black/5 bg-[#E6E6DF] transform hover:-translate-y-1">
          <img src="${person.photo || ''}" alt="${person.name}" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=800&auto=format&fit=crop'">
          
          <div class="absolute inset-x-1 bottom-1 sm:inset-x-3 sm:bottom-3 bg-white/60 hover:bg-white/80 backdrop-blur-xl border border-white/60 shadow-[0_8px_32px_rgba(0,0,0,0.08)] rounded-lg sm:rounded-2xl p-2 sm:p-5 flex flex-col transition-colors duration-300">
            <h3 class="text-[10px] sm:text-lg lg:text-xl font-bold text-[#2A2A1A] leading-tight truncate px-0.5">${person.name}</h3>
            <p class="text-[8px] sm:text-xs lg:text-sm font-semibold text-[#5A5A40] truncate sm:mt-1 px-0.5">${person.category}</p>
            
            <p class="hidden sm:-webkit-box text-sm text-[#424235] line-clamp-3 mt-3 leading-relaxed">
              ${person.bio}
            </p>
            
            <div class="flex items-center gap-1.5 sm:gap-2 mt-1.5 sm:mt-4">
              ${person.ig ? `<a href="${person.ig}" target="_blank" class="flex items-center justify-center w-6 h-6 sm:w-9 sm:h-9 rounded-full bg-white/60 hover:bg-white/90 text-[#2A2A1A] transition-all shadow-sm">${getSVGIcon('ig')}</a>` : ''}
              ${person.threads ? `<a href="${person.threads}" target="_blank" class="flex items-center justify-center w-6 h-6 sm:w-9 sm:h-9 rounded-full bg-white/60 hover:bg-white/90 text-[#2A2A1A] transition-all shadow-sm">${getSVGIcon('threads')}</a>` : ''}
              ${person.web ? `<a href="${person.web}" target="_blank" class="flex items-center justify-center w-6 h-6 sm:w-9 sm:h-9 rounded-full bg-white/60 hover:bg-white/90 text-[#2A2A1A] transition-all shadow-sm">${getSVGIcon('web')}</a>` : ''}
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function submitForm(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    
    const formData = {
      name: document.getElementById('name').value,
      category: document.getElementById('category').value,
      bio: document.getElementById('bio').value,
      photo: document.getElementById('photo').value,
      ig: document.getElementById('ig').value,
      threads: document.getElementById('threads').value,
      web: document.getElementById('web').value,
    };
    
    const origText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = 'Menyimpan...';

    if (typeof google === 'undefined') {
      alert("Local test block: Formulir mensimulasikan penyimpanan sukses. Ini hanya preview workspace.");
       btn.disabled = false;
       btn.innerHTML = origText;
       document.getElementById('registerForm').reset();
       toggleModal('registerModal');
       return;
    }

    google.script.run
      .withSuccessHandler((response) => {
        btn.disabled = false;
        btn.innerHTML = origText;
        
        if(response.success) {
          document.getElementById('registerForm').reset();
          toggleModal('registerModal');
          fetchData(); // reload
        } else {
          alert('Gagal: ' + response.error);
        }
      })
      .withFailureHandler(() => {
        btn.disabled = false;
        btn.innerHTML = origText;
        alert('Cek koneksi internetmu.');
      })
      .simpanData(formData);
  }
</script>
